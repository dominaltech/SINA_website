<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Procurement Sources - SINA Admin</title>
  <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SINA Admin">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Top Persistent Header Taskbar -->
  <header id="sina-admin-header" class="admin-top-bar"></header>


  <main class="admin-container">
    <div class="page-header-row" style="margin-bottom: 16px;">
      <div>
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--green-primary); margin-bottom: 2px;">
          <a href="catalog.html" style="color: var(--green-primary); text-decoration: none;">&larr; Back to Catalog</a>
        </div>
        <h1 class="page-title">Procurement Sources</h1>
        <p class="page-subtitle">Manage sources per category (e.g. Bar/Dhaba/Wineshop, Dealer, Mandi).</p>
      </div>
      <div>
        <button type="button" id="btn-add-source" class="btn btn-primary btn-sm" onclick="window.openSourceModal()">
          + Add Source
        </button>
      </div>
    </div>

    <!-- Category Filter Selector -->
    <div class="card" style="padding: 12px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
      <span style="font-weight: 700; font-size: 0.88rem; color: var(--text-primary);">Filter by Category:</span>
      <select id="source-cat-filter" class="form-select" style="max-width: 260px; font-weight: 700;">
        <option value="all">All Categories</option>
      </select>
    </div>

    <!-- Sources Cards Container -->
    <div id="sources-container" style="margin-bottom: 24px;">
      <div style="text-align: center; padding: 24px; color: var(--text-secondary);">Loading procurement sources...</div>
    </div>
  </main>

  <!-- Add / Edit Source Modal -->
  <div id="source-modal" class="sina-modal-backdrop">
    <div class="sina-modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 id="modal-source-title" style="margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--text-primary);">Add Procurement Source</h3>
        <button type="button" class="icon-btn" onclick="window.closeSourceModal()" style="font-size: 1.2rem;">&times;</button>
      </div>

      <input type="hidden" id="src-id-input">

      <div class="form-group">
        <label class="form-label">Category <span class="required-star">*</span></label>
        <select id="src-category-select" class="form-select" required>
          <option value="" disabled selected>Select Category...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Source Name (English) <span class="required-star">*</span></label>
        <input type="text" id="src-name-input" class="form-input" placeholder="e.g. Bar/Dhaba/Wineshop" required>
      </div>
      <div class="form-group">
        <label class="form-label">Marathi Translation (मराठी)</label>
        <input type="text" id="src-name-mr-input" class="form-input" placeholder="e.g. बार/धाबा/वाईनशॉप">
      </div>
      <div class="form-group">
        <label class="form-label">Hindi Translation (हिन्दी)</label>
        <input type="text" id="src-name-hi-input" class="form-input" placeholder="e.g. बार/ढाबा/वाइनशॉप">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.closeSourceModal()">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-save-source">Save Source</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="admin-toast-container" class="admin-toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sources.js"></script>
</body>
</html>
