<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Company Bank Accounts - SINA Admin</title>
  <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SINA Admin">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Top Persistent Header Taskbar -->
  <header id="sina-admin-header" class="admin-top-bar"></header>


  <main class="admin-container">
    <div class="page-header-row" style="margin-bottom: 16px;">
      <div>
        <h1 class="page-title">Company Bank Accounts</h1>
        <p class="page-subtitle">Corporate payment accounts used by field reps for purchasing goods.</p>
      </div>
      <div>
        <button type="button" id="btn-add-account" class="btn btn-primary btn-sm" onclick="window.openAccountModal()">
          + Add Bank Account
        </button>
      </div>
    </div>

    <!-- Analytics Cards -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px;">
      <div class="kpi-card" style="padding: 12px;">
        <span class="kpi-label">Active Accounts</span>
        <span class="kpi-value" id="kpi-accounts-count" style="color: var(--purple-primary); font-size: 1.4rem;">0</span>
      </div>
      <div class="kpi-card" style="padding: 12px;">
        <span class="kpi-label">Total Disbursed</span>
        <span class="kpi-value" id="kpi-total-disbursed" style="color: var(--green-dark); font-size: 1.4rem;">₹0</span>
      </div>
      <div class="kpi-card" style="padding: 12px;">
        <span class="kpi-label">Transactions Made</span>
        <span class="kpi-value" id="kpi-total-txns" style="color: var(--text-primary); font-size: 1.4rem;">0</span>
      </div>
    </div>

    <!-- Bank Accounts Cards List -->
    <div id="accounts-cards-container" style="margin-bottom: 24px;">
      <div style="text-align: center; padding: 24px; color: var(--text-secondary);">Loading accounts...</div>
    </div>

    <!-- Account-wise Transactions Filter Section -->
    <div class="card" style="margin-bottom: 24px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
        <h3 style="font-size: 1rem; font-weight: 800; color: var(--text-primary); margin: 0;">Account Payment Ledger</h3>
        <div style="min-width: 220px;">
          <select id="account-filter-select" class="form-select" style="font-weight: 700; padding: 6px 10px;">
            <option value="all">All Bank Accounts</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Bank Account</th>
              <th>Seller / Firm</th>
              <th>Rep</th>
              <th>Amount</th>
              <th>Mode / UTR</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="account-txns-tbody">
            <tr><td colspan="7" class="text-center text-muted" style="padding: 20px;">Loading transactions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Bank Account Modal -->
  <div id="account-modal" class="sina-modal-backdrop">
    <div class="sina-modal-card">
      <input type="hidden" id="acc-id-input">
      <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;" id="account-modal-title">Add Bank Account</h3>
      <div class="form-group">
        <label class="form-label">Bank Name *</label>
        <input type="text" id="acc-name-input" class="form-input" placeholder="e.g. HDFC Bank, State Bank of India" required>
      </div>
      <div class="form-group">
        <label class="form-label">Account Number</label>
        <input type="text" id="acc-number-input" class="form-input" placeholder="e.g. 50200084920194">
      </div>
      <div class="form-group">
        <label class="form-label">IFSC Code</label>
        <input type="text" id="acc-ifsc-input" class="form-input" placeholder="e.g. HDFC0001234">
      </div>
      <div class="form-group">
        <label class="form-label">Account Holder Name</label>
        <input type="text" id="acc-holder-input" class="form-input" placeholder="e.g. SINA Operations Ltd.">
      </div>
      <div class="form-group">
        <label class="form-label">Branch Name / Details</label>
        <input type="text" id="acc-branch-input" class="form-input" placeholder="e.g. Main Branch, Pune">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.closeAccountModal()">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-save-account">Save Account</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="admin-toast-container" class="admin-toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/bank-accounts.js"></script>
</body>
</html>
